<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4fb"><title>Meus Treinos 💪</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#242032;background:#f7f4fb}*{box-sizing:border-box}body{margin:0;padding:20px 14px 70px}.wrap{max-width:560px;margin:auto}header{margin:8px 4px 20px}h1{font-size:26px;margin:0 0 4px}header p{margin:0;color:#736c80;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tab{border:1px solid #ddd5e9;background:white;border-radius:14px;padding:13px 8px;font-weight:700;color:#514866;font-size:14px}.tab.active{background:#6d48a5;color:white;border-color:#6d48a5}.panel{margin-top:18px}h2{font-size:21px;margin:0 0 7px}.hint{color:#6c6577;font-size:14px;line-height:1.5;margin:0 0 16px}.progressline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:9px}.reset{background:white;border:1px solid #ddd5e9;padding:8px 12px;border-radius:10px;color:#5c4c70}.track{height:7px;background:#e9e3ee;border-radius:10px;overflow:hidden;margin-bottom:18px}.fill{height:100%;background:#36a780;transition:width .2s}.exercise{background:#fff;border:1px solid #e4deeb;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 6px #28203608}.top{display:flex;align-items:start;gap:12px;justify-content:space-between}.name{font-size:16px;font-weight:700;line-height:1.3}.completed .name{text-decoration:line-through;color:#777}.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:650;color:#5f4a82}.note{font-size:13px;color:#70697a;line-height:1.5;margin:11px 0 0}.check{width:25px;height:25px;accent-color:#36a780;flex:none;margin:0}.success{text-align:center;color:#19805a;font-weight:700;margin:22px}.footer{text-align:center;color:#8c8396;font-size:12px;margin-top:25px}</style></head><body><main class="wrap"><header><h1>💪 Meus Treinos</h1><p>Seu treino organizado, do seu jeito.</p></header><div class="tabs" id="tabs"></div><section class="panel" id="panel"></section><p class="footer">As orientações foram mantidas conforme o treino enviado pela sua personal.</p></main><script>
const data=[{title:'Glúteos e posterior',icon:'🍑',hint:'Antes de começar: mobilidade e alongamento dinâmico.',items:[['Elevação Pélvica','4 × 8–10','90–120s','Aumentar a carga a cada série.'],['Afundo no Guiador','4 × 8 por perna','90–120s','2 steps sob o pé de trás. Descida lenta e subida mais rápida.'],['Agachamento Sumô','3 × (10 + complemento)','90s','10 repetições com carga. Retirar a carga e fazer movimentos curtos até a falha técnica.'],['Cadeira Flexora Sentada','4 × 8–10','60–90s','Segurar 2 segundos na contração. Pontas dos pés para cima.']]},{title:'Superiores + abdômen A',icon:'💪',hint:'Nos exercícios combinados, faça os dois em sequência e descanse ao finalizar o par.',items:[['Face Pull + Tríceps Testa na Polia','3 × 10–12 cada','60s','Exercícios combinados.'],['Puxada Aberta + Desenvolvimento Sentado','3 × 10–12 cada','60–90s','Exercícios combinados.'],['Remada Unilateral no Banco','3 × 8 por lado','60–90s','Carga: 14–16 kg. Manter a execução correta.'],['Bíceps Sentado + Abdominal Infra','3 × 10 + 3 × 1 min','60s','Exercícios combinados.'],['Prancha Alta com Toque nos Ombros','3 × 1 min','45–60s','Abdômen contraído e quadril estável.']]},{title:'Inferiores total',icon:'🏋️',hint:'Priorize a execução correta e respeite os descansos.',items:[['Agachamento Livre','3 × 10–12','60–90s','Pouca carga, priorizando amplitude e execução.'],['Leg Press 360° — Rest-Pause','3 séries','Até 2 min entre séries','10 repetições → 20s → cerca de 10 repetições → 20s → máximo com boa execução.'],['Cadeira Extensora — Progressiva','3 × 10','60–90s','Aumentar a carga a cada série.'],['Passada','4 × 20 passos','60–90s','Equilíbrio e movimento controlado.']]},{title:'Superiores + abdômen B',icon:'🔥',hint:'Mantenha a execução controlada durante todo o treino.',items:[['Supino Reto na Máquina + Elevação Frontal Alternada','3 × 10–12 cada','60s','Exercícios combinados.'],['Crucifixo Inverso na Máquina','3 × 10','60s','Execução controlada.'],['Rosca Drop 7','3 séries','60–90s','Carga média: 8–10 repetições. Carga pesada: 6–8 repetições. Confirmar a sequência com a personal.'],['Tríceps Barra na Polia','3 × 10–15','60s','Caprichar na carga sem perder a execução.'],['Abdominal Oblíquo com Anilha','3 × 20','45s','Movimento controlado.'],['Flexão de Braço no Solo','3 × 10–12','60s',''],['Abdominal Joelho ao Peito + Anilha','3 × 12–15','45–60s','Abdômen contraído. Aguardar vídeo da personal.'],['Panturrilha no Aparelho','3 × 15','45–60s','Amplitude e alongamento máximo controlado.']]}];
let tab=Number(localStorage.getItem('treinoTab')||0);let checked={};try{checked=JSON.parse(localStorage.getItem('treinoChecks')||'{}')}catch{};const save=()=>localStorage.setItem('treinoChecks',JSON.stringify(checked));function render(){document.querySelector('#tabs').innerHTML=data.map((t,i)=>`<button class="tab ${tab===i?'active':''}" data-tab="${i}">${t.icon} Treino ${i+1}</button>`).join('');const t=data[tab],count=t.items.filter((_,i)=>checked[tab+'-'+i]).length;document.querySelector('#panel').innerHTML=`<h2>${t.title}</h2><p class="hint">${t.hint}</p><div class="progressline"><span>${count} de ${t.items.length} exercícios concluídos</span><button class="reset">Reiniciar treino</button></div><div class="track"><div class="fill" style="width:${100*count/t.items.length}%"></div></div>${t.items.map((x,i)=>`<article class="exercise ${checked[tab+'-'+i]?'completed':''}"><div class="top"><div><div class="name">${i+1}. ${x[0]}</div><div class="meta"><span>${x[1]}</span><span>◷ ${x[2]}</span></div></div><input class="check" aria-label="Concluir ${x[0]}" type="checkbox" data-i="${i}" ${checked[tab+'-'+i]?'checked':''}></div>${x[3]?`<p class="note">${x[3]}</p>`:''}</article>`).join('')}${count===t.items.length?'<p class="success">✓ Treino concluído!</p>':''}`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);localStorage.setItem('treinoTab',tab);render()});document.querySelectorAll('[data-i]').forEach(b=>b.onchange=()=>{checked[tab+'-'+b.dataset.i]=b.checked;save();render()});document.querySelector('.reset').onclick=()=>{t.items.forEach((_,i)=>delete checked[tab+'-'+i]);save();render()}}render();
</script></body></html>
